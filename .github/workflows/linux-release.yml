name: Linux Release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build and release Linux x86_64 binaries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build binaries
        run: |
          set -euo pipefail
          cargo build --locked --release --target x86_64-unknown-linux-gnu \
            --package gomo \
            --package gomo-cache-server

      - name: Package binaries
        run: |
          set -euo pipefail

          target_dir="target/x86_64-unknown-linux-gnu/release"
          mkdir -p dist

          package_binary() {
            local binary="$1"
            local archive="${binary}-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz"
            strip "$target_dir/$binary"
            tar -C "$target_dir" -czf "dist/$archive" "$binary"
            checksum="$(sha256sum "dist/$archive")"
            printf '%s  %s\n' "${checksum%% *}" "$archive" > "dist/$archive.sha256"
          }

          package_binary gomo
          package_binary gomo-cache-server

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

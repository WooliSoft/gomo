[package]
name = "gomo-cache-server"
version = "1.8.0"
edition = "2024"
description = "Authenticated immutable HTTP cache service for Gomo"

[dependencies]
anyhow = "1.0.102"
aws-config = "1.8.15"
aws-sdk-s3 = "1.125.0"
aws-smithy-types = "1.6.1"
axum = "0.8.8"
blake3 = "1.8.2"
clap = { version = "4.6.1", features = ["derive"] }
futures = "0.3.32"
gomo-cache-protocol = { path = "../gomo-cache-protocol" }
jsonwebtoken = { version = "9.3.1", features = ["use_pem"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", default-features = false, features = [
  "runtime-tokio-rustls",
  "sqlite",
  "migrate",
  "macros",
] }
subtle = "2.6.1"
tar = "0.4.44"
tempfile = "3.24.0"
time = { version = "0.3.47", features = ["serde"] }
tokio = { version = "1.52.2", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
] }
tokio-util = { version = "0.7.19", features = ["io"] }
tower-http = { version = "0.6.8", features = [
  "limit",
  "request-id",
  "trace",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
uuid = { version = "1.21.0", features = ["v4", "serde"] }
zstd = "0.13.3"

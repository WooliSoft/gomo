[workspace]
members = [".", "crates/gomo-cache-protocol", "crates/gomo-cache-server"]
resolver = "2"

[package]
name = "gomo"
version = "1.8.4"
edition = "2024"
description = "Monorepo tooling for Gleam packages"

[dependencies]
anyhow = "1.0.102"
blake3 = "1.8.2"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = { version = "4.6.5", features = ["unstable-dynamic"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "6.0.0"
futures = "0.3.32"
gomo-cache-protocol = { path = "crates/gomo-cache-protocol" }
git2 = "0.21.0"
globset = "0.4.18"
jj-lib = "0.41.0"
libc = "0.2.186"
ratatui = { version = "0.30.0", default-features = false, features = [
  "crossterm",
] }
reqwest = { version = "0.12.28", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls-native-roots",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tar = "0.4.44"
tempfile = "3.24.0"
tokio = { version = "1.52.2", features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
toml = "1.1.2"
watchexec = "8.2.0"
watchexec-events = "6.1.0"
watchexec-signals = "5.0.1"
walkdir = "2.5.0"
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
zstd = "0.13.3"
